            <h1>Hubungi Saya</h1>

            <form>
                <p>
                    <label for="nama">Nama lengkap</label>

                    <input type="text" id="nama" name="nama" placeholder="Contoh: Orang baik" required>

                    <input type="text" id="email" name="email" placeholder="nama@gimail" required>

                </p>

                <p>
                    <label for="pesan">Pesan</label>
                    <br>
                    <textarea name="pesan" id="pesan" rows="5" cols="40" placeholder="Tulis pelasan mu  di sini" required></textarea>
